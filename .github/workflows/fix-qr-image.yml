name: Add QR download button v2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: npm install
      - run: npm install qrcode

      - name: Patch QrPanel
        run: echo "" | base64 -d | python3 -

      - name: Build
        run: npm run build

      - name: Commit
        run: |
          git config user.name "Masar Bot"
          git config user.email "bot@masar.local"
          git add -A
          git commit -m "Add QR image and download button" || true
          git push

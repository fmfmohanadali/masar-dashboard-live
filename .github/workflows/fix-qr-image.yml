name: Fix QR Image Display

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install deps
        run: npm install

      - name: Add qrcode.react
        run: npm install qrcode.react

      - name: Create QR component
        run: |
          cat > src/components/QrImageDisplay.jsx << 'EOF'
          import { QRCodeSVG } from 'qrcode.react';

          export default function QrImageDisplay({ token, size = 200 }) {
            if (!token) return null;
            return (
              <div className="flex flex-col items-center gap-3 p-4">
                <div className="bg-white p-4 rounded-2xl border-2 border-blue-100 shadow-sm">
                  <QRCodeSVG
                    value={token}
                    size={size}
                    level="M"
                    includeMargin={true}
                  />
                </div>
              </div>
            );
          }
          EOF

      - name: Fix TransportRequestsPage - proper injection
        shell: python3 {0}
        run: |
          with open("src/pages/TransportRequestsPage.jsx", "r") as f:
              code = f.read()

          # First revert bad changes from previous run
          if '<h4 style={{display:"none"}}' in code:
              code = code.replace(
                  '</h4>\n                <QrImageDisplay token={selected?.qr_token} />\n                <h4 style={{display:"none"}}',
                  ''
              )
              print("Reverted bad injection")

          # Remove duplicate import if exists
          code = code.replace(
              "import QrImageDisplay from '../components/QrImageDisplay';\n",
              ""
          )

          # Add clean import
          code = code.replace(
              "import LoadingCard from '../components/LoadingCard';",
              "import LoadingCard from '../components/LoadingCard';\nimport QrImageDisplay from '../components/QrImageDisplay';"
          )

          # Find the QR token display section and add image BEFORE the token text
          # Look for the pattern where qr_token is shown
          if "selected.qr_token" in code or "selected?.qr_token" in code:
              # Find "QR النهائي" section
              qr_marker = 'QR النهائي'
              if qr_marker in code and '<QrImageDisplay' not in code:
                  # Find the div that contains the QR section
                  idx = code.find(qr_marker)
                  # Go back to find the opening div/section
                  # Find the line with qr_token text display
                  lines = code.split('\n')
                  for i, line in enumerate(lines):
                      if qr_marker in line:
                          # Insert QrImageDisplay component after this line's parent closes
                          # Find the next line that has qr_token
                          for j in range(i+1, min(i+10, len(lines))):
                              if 'qr_token' in lines[j] and '<code' in lines[j]:
                                  # Insert QR image before the code/text display
                                  indent = '                '
                                  lines.insert(j, f'{indent}<QrImageDisplay token={{selected?.qr_token}} />')
                                  print(f"Inserted QrImageDisplay at line {j}")
                                  break
                          break
                  code = '\n'.join(lines)

          with open("src/pages/TransportRequestsPage.jsx", "w") as f:
              f.write(code)
          print("Done")

      - name: Test build
        run: npm run build

      - name: Commit
        run: |
          git config user.name "Masar Bot"
          git config user.email "bot@masar.local"
          git add -A
          git commit -m "Add QR code image to transport requests" || true
          git push

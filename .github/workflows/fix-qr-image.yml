name: Fix error messages and QR display

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install deps
        run: npm install

      - name: Fix error handling in TransportRequestsPage
        shell: python3 {0}
        run: |
          with open("src/pages/TransportRequestsPage.jsx", "r") as f:
              code = f.read()

          # Fix all error message extraction to handle new API format
          # Old: err?.response?.data?.detail || 'message'
          # New: err?.response?.data?.errors?.detail || err?.response?.data?.message || err?.response?.data?.detail || 'message'

          old_patterns = [
              "err?.response?.data?.detail || 'تعذر تنفيذ الإجراء'",
              "err?.response?.data?.detail || 'تعذر إنشاء طلب النقل'",
              "err?.response?.data?.detail || 'تعذر إضافة العرض'",
              "err?.response?.data?.detail || 'تعذر تحميل بيانات طلبات النقل'",
              "err?.response?.data?.detail || 'تعذر تحميل طلبات النقل'",
          ]

          for old in old_patterns:
              fallback = old.split("|| '")[1].rstrip("'")
              new = f"err?.response?.data?.errors?.detail || err?.response?.data?.message || err?.response?.data?.detail || '{fallback}'"
              if old in code:
                  code = code.replace(old, new)
                  print(f"Fixed: {fallback}")

          with open("src/pages/TransportRequestsPage.jsx", "w") as f:
              f.write(code)
          print("Done fixing error messages")

      - name: Test build
        run: |
          npm run build

      - name: Commit
        run: |
          git config user.name "Masar Bot"
          git config user.email "bot@masar.local"
          git add -A
          git commit -m "Fix error message extraction for new API format

          The backend now returns errors in this format:
          { success: false, errors: { detail: '...' }, message: '...' }

          Updated all error handlers to check:
          1. err.response.data.errors.detail (new format)
          2. err.response.data.message (new format)
          3. err.response.data.detail (old format)
          4. fallback message
          " || true
          git push

